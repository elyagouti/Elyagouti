/* Design tokens shared by the public site and the admin dashboard. */
:root {
  --bg: #071426;
  --surface: #10233d;
  --surface-2: #162f4f;
  --surface-3: #1d3b61;
  --sunken: #0a1a30;
  --text: #ffffff;
  --muted: #bccbe0;
  --faint: #93a8c4;
  --btn: #2367b2;
  --btn-hover: #2d78cb;
  --accent: #67b7ff;
  --line: rgba(103, 183, 255, 0.18);
  --line-strong: rgba(103, 183, 255, 0.42);
  --danger: #ff8f8f;
  --danger-bg: rgba(255, 143, 143, 0.12);
  --ok: #72e6ae;
  --ok-bg: rgba(114, 230, 174, 0.12);
  --warn: #ffd37a;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 28px;
  color-scheme: dark;
}

<style>
/* Public portfolio styles. Tokens live in tokens.css. */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.container { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 1.15em; height: 1.15em; flex: none; }

.skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--btn); color: #fff; padding: 10px 16px; border-radius: var(--r-sm); font-weight: 700; transition: top .2s; }
.skip-link:focus { top: 12px; }

/* ---------- Buttons ---------- */
.btn {
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 22px; border-radius: 10px; border: 1px solid transparent;
  background: var(--btn); color: #fff; font-weight: 700; line-height: 1.2; cursor: pointer;
  transition: background .18s, border-color .18s, transform .18s;
}
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-ghost:hover { background: rgba(103, 183, 255, 0.1); border-color: var(--accent); }
.btn[disabled] { opacity: .65; cursor: progress; }
.btn-sm { padding: 9px 16px; font-size: .95rem; }

/* ---------- Navigation ---------- */
.site-nav { position: sticky; top: 0; z-index: 50; background: rgba(7, 20, 38, 0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 72px; }
.brand { white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--btn); font-size: .95rem; font-weight: 800; letter-spacing: 0; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-links a { padding: 8px 9px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: .96rem; transition: color .15s, background .15s; }
.nav-links a:hover { color: var(--text); background: rgba(103, 183, 255, .08); }
.nav-links a { position: relative; }
.nav-links a::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.nav-links a:hover::after, .nav-links a[aria-current="true"]::after { transform: scaleX(1); }
.nav-links a[aria-current="true"] { color: var(--text); }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.nav-toggle { display: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; place-items: center; }
.nav-toggle span, .nav-toggle span::before, .nav-toggle span::after { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; position: relative; transition: transform .2s, opacity .2s; content: ''; }
.nav-toggle span::before { position: absolute; top: -6px; }
.nav-toggle span::after { position: absolute; top: 6px; }
.nav-open .nav-toggle span { background: transparent; }
.nav-open .nav-toggle span::before { transform: translateY(6px) rotate(45deg); }
.nav-open .nav-toggle span::after { transform: translateY(-6px) rotate(-45deg); }

/* ---------- Sections ---------- */
.section { padding: clamp(64px, 9vw, 112px) 0; border-top: 1px solid var(--line); }
.section[data-tone="alt"] { background: linear-gradient(180deg, rgba(16, 35, 61, .55), rgba(16, 35, 61, .2)); }
.section-head { max-width: 46rem; margin-bottom: clamp(32px, 5vw, 52px); }
.section-head h2, .contact-copy h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 4.4vw, 3.1rem); line-height: 1.08; letter-spacing: -0.025em; }
.section-head p { margin-top: 14px; color: var(--muted); font-size: 1.1rem; max-width: 40rem; }
.empty { padding: 28px; border: 1px dashed var(--line-strong); border-radius: var(--r-lg); color: var(--muted); text-align: center; }

/* ---------- Hero ---------- */
.hero { padding: clamp(40px, 7vw, 88px) 0 clamp(56px, 8vw, 104px); border-top: 0; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
.hero-badge { display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(16, 35, 61, .7); color: var(--muted); font-size: .95rem; font-weight: 600; }
.hero-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(114, 230, 174, .5); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(114, 230, 174, 0); } 100% { box-shadow: 0 0 0 0 rgba(114, 230, 174, 0); } }
.hero h1 { margin-top: 24px; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.8rem, 7.2vw, 5.4rem); line-height: .98; letter-spacing: -0.04em; text-wrap: balance; }
.hero-role { margin-top: 18px; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.25rem, 2.4vw, 1.7rem); color: var(--accent); letter-spacing: -0.01em; }
.hero-tagline { margin-top: 18px; max-width: 34rem; color: var(--muted); font-size: 1.15rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.social-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
.social-row a { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); transition: color .15s, border-color .15s, background .15s; }
.social-row a:hover { color: var(--text); border-color: var(--accent); background: rgba(103, 183, 255, .08); }
.social-row .icon { width: 20px; height: 20px; }

.hero-figure { position: relative; aspect-ratio: 4 / 5; max-height: 640px; width: 100%; justify-self: end; border-radius: var(--r-xl); border: 1px solid var(--line-strong); background: linear-gradient(160deg, var(--surface) 0%, #0b1d36 100%); overflow: hidden; }
.hero-figure svg.plot { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-figure .portrait { position: absolute; left: 0; right: 0; bottom: 0; height: 66%; width: 100%; object-fit: cover; object-position: 50% 8%; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%); mask-image: linear-gradient(to bottom, transparent 0, #000 30%); }
.plot .grid-line { stroke: rgba(103, 183, 255, .09); stroke-width: 1; }
.plot .axis { stroke: rgba(103, 183, 255, .35); stroke-width: 1.5; }
.plot .dot { fill: var(--accent); }
.plot .fit { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .plot .dot { animation: settle 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d); }
  .plot .fit { animation: draw 1.2s ease-out 1.5s both; }
}
@keyframes settle { from { transform: translate(var(--dx), var(--dy)); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.about-grid.has-photo { grid-template-columns: minmax(220px, .55fr) minmax(0, 1fr) minmax(0, .8fr); }
.about-photo { border-radius: var(--r-lg); border: 1px solid var(--line-strong); aspect-ratio: 4/5; object-fit: cover; width: 100%; }
.prose p { color: var(--muted); font-size: 1.12rem; max-width: 38rem; }
.prose p + p { margin-top: 1.1em; }
.journey h3 { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 18px; }
.journey ol { border-left: 1px solid var(--line-strong); margin-left: 5px; }
.journey li { position: relative; padding: 0 0 26px 26px; }
.journey li:last-child { padding-bottom: 0; }
.journey li::before, .tl-item::before { content: ''; position: absolute; left: -6px; top: .5em; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.journey strong { display: block; font-family: var(--font-display); font-size: 1.12rem; }
.journey span { color: var(--muted); }

/* ---------- Timeline (education / experience) ---------- */
.timeline { border-left: 1px solid var(--line-strong); margin-left: 5px; max-width: 52rem; }
.tl-item { position: relative; padding: 0 0 44px 32px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { top: .62em; }
.tl-row { display: flex; gap: 16px; align-items: flex-start; }
.tl-logo { width: 46px; height: 46px; border-radius: 10px; object-fit: contain; background: #fff; padding: 4px; flex: none; }
.tl-item h3 { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.25; letter-spacing: -0.01em; }

.tl-org a:hover { text-decoration: underline; text-underline-offset: 3px; }
.tl-meta { margin-top: 4px; color: var(--faint); font-size: .95rem; }
.tl-desc { margin-top: 12px; color: var(--muted); }

/* ---------- Skills ---------- */
.skill-row { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 14px 48px; padding: 26px 0; border-top: 1px solid var(--line); }
.skill-row:last-child { border-bottom: 1px solid var(--line); }
.skill-row h3, .svc-cat h3 { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.25; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }

.chip img { width: 18px; height: 18px; object-fit: contain; }

/* ---------- Services ---------- */
.svc-cat + .svc-cat { margin-top: 56px; }

.svc-card { display: flex; flex-direction: column; gap: 12px; padding: 24px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); transition: border-color .18s; }
.svc-card:hover { border-color: var(--line-strong); }
.svc-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--surface-3); font-size: 1.5rem; line-height: 1; overflow: hidden; }
.svc-icon img { width: 100%; height: 100%; object-fit: cover; }
.svc-card h4 { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.3; }
.svc-card p { color: var(--muted); font-size: 1rem; }
.svc-card .more { margin-top: auto; color: var(--accent); font-weight: 700; font-size: .96rem; }
.svc-card .more:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Projects ---------- */
.filters { display: grid; gap: 14px; margin-bottom: 28px; }
.filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.filter-label { color: var(--faint); font-size: .95rem; font-weight: 600; min-width: 5.5rem; }
.pill { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: .95rem; cursor: pointer; transition: all .15s; }
.pill:hover { border-color: var(--accent); color: var(--text); }
.pill[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: #fff; }
.filter-count { color: var(--faint); font-size: .92rem; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 24px; margin-top: 18px; }
.proj-card { display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); overflow: hidden; transition: border-color .18s, transform .18s; }
.proj-card:hover { border-color: var(--line-strong); transform: translateY(-3px); }
.proj-media { position: relative; aspect-ratio: 16 / 10; background: var(--sunken); overflow: hidden; }
.proj-media img { position: relative; width: 100%; height: 100%; object-fit: cover; }
.proj-fallback { position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(135deg, rgba(103,183,255,.05) 0 14px, transparent 14px 28px), linear-gradient(160deg, var(--surface-2), var(--sunken)); color: rgba(103, 183, 255, .5); }
.proj-fallback .icon { width: 56px; height: 56px; }
.proj-badge { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: rgba(7, 20, 38, .88); border: 1px solid var(--line-strong); font-size: .85rem; font-weight: 700; backdrop-filter: blur(6px); }
.proj-body { display: flex; flex-direction: column; gap: 10px; padding: 22px; flex: 1; }
.proj-cat { color: var(--accent); font-size: .92rem; font-weight: 700; }
.proj-card h3 { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; letter-spacing: -0.01em; }
.proj-desc { color: var(--muted); font-size: 1rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag { padding: 3px 10px; border-radius: 6px; background: var(--surface-3); color: var(--muted); font-size: .85rem; font-weight: 600; }
.proj-foot { margin-top: auto; padding-top: 14px; }
.proj-foot .btn { width: 100%; }
.card-note { display: block; text-align: center; color: var(--faint); font-size: .95rem; padding: 12px 0; }

/* ---------- Certificates ---------- */
.cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; }
.cert-card { display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.cert-media { aspect-ratio: 4 / 3; background: var(--sunken); display: grid; place-items: center; }
.cert-media img { width: 100%; height: 100%; object-fit: contain; }
.cert-body { display: flex; flex-direction: column; gap: 6px; padding: 20px 22px 22px; flex: 1; }
.cert-body h3 { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.3; }
.cert-issuer { color: var(--accent); font-weight: 600; }
.cert-meta { color: var(--faint); font-size: .92rem; }
.cert-body p { color: var(--muted); font-size: .98rem; }
.cert-body .btn { margin-top: auto; align-self: flex-start; }
.cert-body .btn-sm { margin-top: 12px; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.contact-copy .lead { margin-top: 14px; color: var(--accent); font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.contact-copy .prose { margin-top: 16px; }
.details { margin-top: 28px; display: grid; gap: 14px; }
.details li { display: flex; align-items: flex-start; gap: 14px; }
.details .icon-box { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--accent); flex: none; }

.details a:hover { text-decoration: underline; text-underline-offset: 3px; }
.contact-social { margin-top: 30px; }
.contact-social h3 { font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 4px; }
.form-card { padding: clamp(22px, 4vw, 34px); border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line-strong); }

.field input::placeholder, .field textarea::placeholder { color: var(--faint); }
.field textarea { min-height: 150px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(103, 183, 255, .25); }
.field[data-invalid="true"] input, .field[data-invalid="true"] textarea { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: .9rem; min-height: 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-status { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-weight: 600; font-size: .98rem; }
.form-status[data-state="ok"] { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(114, 230, 174, .4); }
.form-status[data-state="error"] { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(255, 143, 143, .4); }
.form-card .btn { width: 100%; }
.form-card .alt-mail { margin-top: 14px; text-align: center; color: var(--muted); font-size: .95rem; }
.form-card .alt-mail a { color: var(--accent); font-weight: 700; }

/* ---------- Footer & misc ---------- */
.site-footer { border-top: 1px solid var(--line); padding: 36px 0 44px; background: var(--sunken); }
.footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 22px 32px; }
.footer-brand { display: flex; align-items: center; gap: 12px; }
.footer-brand small { display: block; color: var(--faint); }
.footer-links { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .95rem; }
.footer-links a:hover { color: var(--text); }
.footer-bottom { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--faint); font-size: .92rem; padding-top: 22px; border-top: 1px solid var(--line); }
.site-footer .social-row { margin-top: 0; }
.offline-note { color: var(--warn); }
.to-top { position: fixed; right: 20px; bottom: 20px; z-index: 40; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { border-color: var(--accent); }
.boot { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
.boot::before { content: ''; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--accent); animation: spin .9s linear infinite; margin-bottom: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.preview-banner { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 90; padding: 9px 18px; border-radius: 999px; background: var(--warn); color: #1a1200; font-weight: 700; font-size: .9rem; box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: calc(100% - 24px); text-align: center; }

/* ================= Motion & design layer ================= */
.scroll-progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: linear-gradient(90deg, var(--btn), var(--accent)); transform: scaleX(0); transform-origin: left; }

/* Buttons: light sweep on hover */
.btn { position: relative; overflow: hidden; }
.btn::after { content: ""; position: absolute; top: 0; left: -130%; width: 55%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); transform: skewX(-20deg); transition: left .7s; pointer-events: none; }
.btn:hover::after { left: 150%; }
.btn { box-shadow: 0 0 0 rgba(103,183,255,0); transition: background .18s, border-color .18s, transform .18s, box-shadow .25s; }
.btn:not(.btn-ghost):hover { box-shadow: 0 8px 26px rgba(35,103,178,.45); transform: translateY(-2px); }

/* Section titles get an accent bar */
.section-head h2::after, .contact-copy h2::after { content: ""; display: block; width: 64px; height: 4px; margin-top: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--btn)); transition: width .8s cubic-bezier(.2,.7,.2,1) .2s; }
.section-head.reveal:not(.in) h2::after, .contact-copy h2.reveal:not(.in)::after { width: 0; }

/* Subtle data-grid texture on alternate sections */
.section[data-tone="alt"] { background-image: radial-gradient(rgba(103,183,255,.09) 1px, transparent 1px), linear-gradient(180deg, rgba(16,35,61,.6), rgba(16,35,61,.2)); background-size: 28px 28px, auto; }

/* Hero: drifting glow orbs, shimmering role, floating portrait */
.hero { position: relative; overflow: hidden; isolation: isolate; }
.hero::before, .hero::after { content: ""; position: absolute; z-index: -1; width: 620px; height: 620px; border-radius: 50%; filter: blur(30px); pointer-events: none; }
.hero::before { top: -240px; right: -120px; background: radial-gradient(circle, rgba(35,103,178,.55), transparent 65%); }
.hero::after { bottom: -300px; left: -160px; background: radial-gradient(circle, rgba(103,183,255,.22), transparent 65%); }
.hero-role { background: linear-gradient(90deg, #67b7ff 0%, #ffffff 45%, #67b7ff 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--accent); }
.hero-figure { box-shadow: 0 30px 80px rgba(2, 10, 24, .6), 0 0 0 1px rgba(103,183,255,.1); }

/* Skills ticker */
.marquee { overflow: hidden; border-block: 1px solid var(--line); background: rgba(10, 26, 48, .7); padding: 16px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track { display: flex; width: max-content; gap: 14px; }
.marquee span { white-space: nowrap; padding: 6px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: .95rem; }
.marquee span:nth-child(3n) { color: var(--accent); border-color: var(--line-strong); }

/* Cards: pointer spotlight, lift, image zoom */
.svc-card, .proj-card, .cert-card, .form-card, .social-card { position: relative; }
.svc-card::after, .proj-card::after, .cert-card::after, .form-card::after, .social-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), rgba(103,183,255,.16), transparent 45%); }
.svc-card:hover::after, .proj-card:hover::after, .cert-card:hover::after, .form-card:hover::after, .social-card:hover::after { opacity: 1; }
.svc-card { transition: border-color .18s, transform .25s, box-shadow .25s; }
.svc-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(2,10,24,.45); }
.svc-icon { transition: transform .35s cubic-bezier(.3,1.6,.5,1), background .2s; }
.svc-card:hover .svc-icon { transform: rotate(-8deg) scale(1.12); background: var(--btn); }
.proj-card:hover { box-shadow: 0 22px 50px rgba(2,10,24,.5); }
.proj-media img { transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.proj-card:hover .proj-media img { transform: scale(1.07); }
.cert-card { transition: border-color .18s, transform .25s; }
.cert-card:hover { border-color: var(--line-strong); transform: translateY(-4px); }
.chip { transition: border-color .15s, background .15s, transform .2s, box-shadow .2s; }
.chip:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(2,10,24,.4); }
.tl-item::before { transition: background .2s, box-shadow .2s; }
.tl-item:hover::before, .journey li:hover::before { background: var(--accent); box-shadow: 0 0 0 6px rgba(103,183,255,.2); }
.pill { transition: all .2s; }
.pill:hover { transform: translateY(-1px); }

/* Contact link cards (LinkedIn, GitHub, ...) */
.contact-social { margin-top: 32px; }
.social-cards { display: grid; gap: 12px; margin-top: 14px; }
.social-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .2s; }
.social-card:hover { transform: translateX(6px); border-color: var(--accent); }
.social-card .icon-box { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-3); color: var(--accent); flex: none; transition: background .2s, color .2s; }
.social-card:hover .icon-box { background: var(--btn); color: #fff; }
.social-card .icon { width: 22px; height: 22px; }
.sc-text { display: grid; min-width: 0; }
.sc-name { font-weight: 800; font-family: var(--font-display); }
.sc-url { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: no-preference) {
  /* Page-load choreography for the hero */
  .hero-copy > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .hero-copy > :nth-child(1) { animation-delay: .05s; } .hero-copy > :nth-child(2) { animation-delay: .15s; }
  .hero-copy > :nth-child(3) { animation-delay: .27s; } .hero-copy > :nth-child(4) { animation-delay: .38s; }
  .hero-copy > :nth-child(5) { animation-delay: .5s; } .hero-copy > :nth-child(6) { animation-delay: .62s; }
  .hero-figure { animation: rise-fig 1.1s cubic-bezier(.2,.7,.2,1) .2s both, float 9s ease-in-out 1.4s infinite; }
  .hero-role { animation: rise .9s cubic-bezier(.2,.7,.2,1) .27s both, shimmer 7s linear 1.2s infinite; }
  .hero::before { animation: drift 16s ease-in-out infinite alternate; }
  .hero::after { animation: drift 20s ease-in-out infinite alternate-reverse; }
  .marquee-track { animation: marquee 45s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .site-nav { animation: drop .7s cubic-bezier(.2,.7,.2,1) both; }
  /* Scroll reveal (classes are added by JS, so content stays visible without it) */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 80ms); }
  .reveal.in { opacity: 1; transform: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes rise-fig { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes shimmer { to { background-position: -220% 0; } }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, 50px) scale(1.15); } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes drop { from { transform: translateY(-100%); } to { transform: none; } }

/* ---------- Responsive ---------- */
@media (min-width: 1141px) and (max-width: 1400px) { .nav-actions .btn { display: none; } }
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-figure { order: -1; max-width: 420px; justify-self: start; aspect-ratio: 4 / 4.2; }
  .about-grid, .about-grid.has-photo { grid-template-columns: 1fr; }

}

  .nav-open .nav-links { display: flex; }
  .nav-links a { padding: 14px 8px; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 1.05rem; }
  .nav-links a::after { display: none; }
  .nav-links a[aria-current="true"] { box-shadow: inset 3px 0 0 var(--accent); border-radius: 0; }
  .nav-actions .btn { display: none; }
}
@media (max-width: 720px) {
  body { font-size: 1rem; }
  .skill-row { grid-template-columns: 1fr; gap: 14px; }
  .hero-figure { max-width: 100%; aspect-ratio: 4 / 3.6; }

}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* assets/js/config.js */
/*

  supabaseUrl: 'https://dyaqfwhdmdzposqbzxfc.supabase.co',

/* Shared helpers: escaping, URL safety, validation, data normalisation. */
(function () {
  'use strict';
  const PF = (window.PF = window.PF || {});

  /* ---------- Generic helpers ---------- */
  PF.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  PF.uid = (p) => (p || 'id') + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  PF.clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  PF.isPlain = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  PF.same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  PF.year = () => new Date().getFullYear();

  PF.getPath = (obj, path) => String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  PF.setPath = (obj, path, value) => {
    const keys = String(path).split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => (o[k] == null ? (o[k] = {}) : o[k]), obj);
    target[last] = value;
  };

  /* Split text into paragraphs; single line breaks become <br>. Always escaped. */
  PF.paragraphs = (text) =>
    String(text || '')
      .split(/\n\s*\n/)
      .map((p) => p.trim())
      .filter(Boolean)
      .map((p) => '<p>' + PF.esc(p).replace(/\n/g, '<br>') + '</p>')
      .join('');

  /* ---------- URL safety ---------- */
  const REL = /^(?![a-z][a-z0-9+.-]*:)(?!\/\/)[^\s<>"'\\]+$/i;
  /**
   * Returns a safe URL string or '' when the value is not allowed.
   * Allowed: http(s) always; #hash, mailto:, tel:, relative paths on request.
   */
  PF.safeUrl = (value, opts) => {
    opts = opts || {};
    const u = String(value == null ? '' : value).trim();
    if (!u) return '';
    if (u.charAt(0) === '#') return opts.hash ? u : '';
    if (/^mailto:/i.test(u)) return opts.mail && /^mailto:[^\s@<>"']+@[^\s@<>"']+$/i.test(u.split('?')[0]) ? u : '';
    if (/^tel:/i.test(u)) return opts.tel && /^tel:[+\d\s().-]{3,}$/i.test(u) ? u : '';
    if (/^https?:\/\//i.test(u)) {
      try {
        const parsed = new URL(u);
        return /^https?:$/.test(parsed.protocol) && parsed.hostname ? parsed.href : '';
      } catch (e) {
        return '';
      }
    }
    if (opts.relative && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/i.test(u)) return u;
    return opts.relative && REL.test(u) ? u : '';
  };
  PF.LINK = { hash: true, mail: true, tel: true };
  PF.IMG = { relative: true };
  PF.isExternal = (url) => /^https?:\/\//i.test(url || '');
  /* Attributes for an <a>: external links open in a new tab with security attributes. */
  PF.linkAttrs = (url) => (PF.isExternal(url) ? ' target="_blank" rel="noopener noreferrer"' : '');
  PF.hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; } };

  /* ---------- Project platforms ---------- */
  PF.PLATFORMS = {
    kaggle: { label: 'Kaggle' },
    github: { label: 'GitHub' },
    live: { label: 'Live Demo' },
    other: { label: 'Other' }
  };
  PF.platformOf = (p) => (PF.PLATFORMS[p && p.platform] ? p.platform : 'other');

  /* Kaggle URL type: Notebook, Dataset, Competition, Model, Profile or ''. */
  PF.kaggleKind = (url) => {
    let u;
    try { u = new URL(url); } catch (e) { return ''; }
    if (PF.hostOf(url) !== 'kaggle.com') return '';
    const seg = u.pathname.split('/').filter(Boolean);
    if (!seg.length) return '';
    const first = seg[0].toLowerCase();
    if (first === 'competitions' || first === 'c') return 'Competition';
    if (first === 'datasets') return 'Dataset';
    if (first === 'models') return 'Model';
    if (first === 'code') return 'Notebook';
    if (['discussions', 'learn', 'docs', 'organizations', 'benchmarks'].includes(first)) return '';
    if (seg.length === 1) return 'Profile';
    return 'Notebook'; /* legacy /username/notebook-slug format */
  };

  /* Returns '' when valid, otherwise a human-readable message. */
  PF.validateProjectUrl = (platform, url) => {
    const raw = String(url || '').trim();
    if (!raw) {
      return platform === 'other' ? '' : 'Add the project URL so the button has somewhere to go.';
    }
    if (!PF.safeUrl(raw)) return 'Enter a full URL that starts with https:// (or http://).';
    const host = PF.hostOf(raw);
    if (platform === 'kaggle' && host !== 'kaggle.com') return 'Kaggle projects need a kaggle.com URL (notebook, dataset or competition).';
    if (platform === 'github' && !(host === 'github.com' || host.endsWith('.github.com'))) return 'GitHub projects need a github.com URL.';
    return '';
  };

  /* ---------- Sections ---------- */
  PF.SECTION_META = {
    hero: { label: 'Home / Hero', anchor: 'home', required: true, position: 'first' },
    about: { label: 'About Me', anchor: 'about' },
    education: { label: 'Education', anchor: 'education' },
    experience: { label: 'Experience', anchor: 'experience' },
    skills: { label: 'Skills', anchor: 'skills' },
    services: { label: 'Services', anchor: 'services' },
    projects: { label: 'Projects', anchor: 'projects' },
    certificates: { label: 'Certificates', anchor: 'certificates' },
    contact: { label: 'Contact', anchor: 'contact', required: true, position: 'last' }
  };
  PF.SECTION_ORDER = ['hero', 'about', 'education', 'experience', 'skills', 'services', 'projects', 'certificates', 'contact'];

  /* Hero is always first and Contact is always last. Unknown ids are dropped. */
  PF.normalizeSections = (list, defaults) => {
    const byId = {};
    (Array.isArray(list) ? list : []).forEach((s) => { if (s && PF.SECTION_META[s.id] && !byId[s.id]) byId[s.id] = s; });
    const def = {};
    defaults.forEach((s) => (def[s.id] = s));
    const build = (id) => {
      const merged = Object.assign({}, def[id], byId[id] || {});
      merged.id = id;
      merged.enabled = merged.enabled !== false;
      merged.showInNav = merged.showInNav !== false;
      merged.navLabel = typeof merged.navLabel === 'string' ? merged.navLabel : def[id].navLabel;
      if (PF.SECTION_META[id].required) merged.enabled = true;
      return merged;
    };
    const given = (Array.isArray(list) ? list : []).map((s) => s && s.id).filter((id, i, a) => PF.SECTION_META[id] && a.indexOf(id) === i);
    const middle = given.filter((id) => id !== 'hero' && id !== 'contact');
    PF.SECTION_ORDER.forEach((id) => { if (id !== 'hero' && id !== 'contact' && !middle.includes(id)) middle.push(id); });
    return ['hero'].concat(middle, ['contact']).map(build);
  };

  /* ---------- Merge & normalise ---------- */
  PF.merge = (base, over) => {
    if (over === undefined || over === null) return PF.clone(base);
    if (base === undefined) return PF.clone(over);
    if (PF.isPlain(base) && PF.isPlain(over)) {
      const out = {};
      Object.keys(base).concat(Object.keys(over)).forEach((k) => {
        if (k in out) return;
        out[k] = k in over ? PF.merge(base[k], over[k]) : PF.clone(base[k]);
      });
      return out;
    }
    if (Array.isArray(base)) return Array.isArray(over) ? PF.clone(over) : PF.clone(base);
    if (typeof base === 'string') return typeof over === 'string' ? over : String(over);
    if (typeof base === 'boolean') return !!over;
    return PF.clone(over);
  };

  const LISTS = [
    'social', 'about.journey', 'education.items', 'experience.items', 'projects.items', 'certificates.items',
    'skills.categories', 'services.categories'
  ];
  PF.ensureIds = (data) => {
    const fix = (arr, prefix) => (Array.isArray(arr) ? arr : []).forEach((x) => { if (PF.isPlain(x) && !x.id) x.id = PF.uid(prefix); });
    LISTS.forEach((p) => fix(PF.getPath(data, p), p.split('.').pop().slice(0, 3)));
    ['skills', 'services'].forEach((k) => (data[k].categories || []).forEach((c) => { c.items = Array.isArray(c.items) ? c.items : []; fix(c.items, 'itm'); }));
    return data;
  };

  /* Always returns a complete, safe document (missing keys filled from defaults). */
  PF.normalize = (raw) => {
    const defaults = PF.defaults();
    const merged = PF.merge(defaults, PF.isPlain(raw) ? raw : {});
    merged.sections = PF.normalizeSections(raw && raw.sections, defaults.sections);
    LISTS.forEach((p) => { if (!Array.isArray(PF.getPath(merged, p))) PF.setPath(merged, p, []); });
    return PF.ensureIds(merged);
  };

  /* Enabled sections in render order (Hero first, Contact last - always). */
  PF.visibleSections = (data) => {
    const all = PF.normalizeSections(data.sections, PF.defaults().sections).filter((s) => s.enabled);
    const contact = all.filter((s) => s.id === 'contact');
    return all.filter((s) => s.id !== 'contact').concat(contact);
  };

  PF.errMsg = (err) => {
    if (!err) return 'Unknown error.';
    const m = String(err.message || err);
    if (err.code === '42P01' || err.code === 'PGRST205' || /does not exist|Could not find the table/i.test(m)) return 'A required table is missing. Run supabase/schema.sql in the Supabase SQL editor.';
    if (err.code === '42501' || /row-level security|permission denied|not authorized|violates row/i.test(m)) return 'Permission denied. Check that this account is listed in the admins table.';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Network error. Check your connection and try again.';
    if (err.code === '23514' || /check constraint/i.test(m)) return 'The database rejected the data (check constraint). Make sure Contact is the last section and the content is valid.';
    return m;
  };
})();

/* assets/js/shared/store.js */
/*
 * Data access layer (Supabase). All persistence goes through here so the rest of the
 * code never talks to the database directly.
 *
 *  - Public visitors: read portfolio_published, insert into contact_messages.
 *  - Admin (authenticated + listed in `admins`): everything else. Enforced by RLS.
 */
(function () {
  'use strict';
  const PF = (window.PF = window.PF || {});
  const CACHE_KEY = 'pf-published-cache-v1';

  PF.isConfigured = (cfg) =>
    !!cfg && /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.supabaseUrl || '') && !!cfg.supabaseAnonKey && !/YOUR|<|>/i.test(cfg.supabaseAnonKey);

  /* Resize + compress raster images before upload (keeps pages fast). */
  function optimizeImage(file, maxSide, quality) {
    return new Promise((resolve) => {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob && blob.size < file.size ? blob : file), 'image/webp', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  PF.createStore = function () {
    const cfg = window.PORTFOLIO_CONFIG || {};
    const T = cfg.tables || {};
    const configured = PF.isConfigured(cfg);
    const client = configured && window.supabase && window.supabase.createClient
      ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } })
      : null;

    const need = () => { if (!client) throw new Error('Supabase is not configured. Check assets/js/config.js and that the Supabase script loaded.'); return client; };
    const unwrap = (res) => { if (res.error) throw res.error; return res.data; };

    const store = {
      configured, client, available: !!client,

      /* ----- Content ----- */
      async loadPublished() {
        const row = unwrap(await need().from(T.published).select('data,updated_at').eq('id', 1).maybeSingle());
        return row ? { data: row.data, updatedAt: row.updated_at } : null;
      },
      async loadDraft() {
        const row = unwrap(await need().from(T.draft).select('data,updated_at').eq('id', 1).maybeSingle());
        return row ? { data: row.data, updatedAt: row.updated_at } : null;
      },
      async saveDraft(data) {
        const user = (await this.getUser()) || {};
        unwrap(await need().from(T.draft).upsert({ id: 1, data, updated_at: new Date().toISOString(), updated_by: user.id || null }, { onConflict: 'id' }));
      },
      async publish(data) {
        const user = (await this.getUser()) || {};
        const row = { id: 1, data, updated_at: new Date().toISOString(), updated_by: user.id || null };
        unwrap(await need().from(T.published).upsert(row, { onConflict: 'id' }));
        unwrap(await need().from(T.draft).upsert(row, { onConflict: 'id' }));
      },
      readCache() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && c.data ? c.data : null; } catch (e) { return null; } },
      writeCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data })); } catch (e) { /* storage unavailable */ } },

      /* ----- Auth ----- */
      async getUser() { if (!client) return null; const { data } = await client.auth.getSession(); return data && data.session ? data.session.user : null; },
      async signIn(email, password) { const d = unwrap(await need().auth.signInWithPassword({ email, password })); return d.user; },
      async signOut() { if (client) await client.auth.signOut(); },
      async isAdmin() {
        const user = await this.getUser();
        if (!user) return false;
        const { data, error } = await need().from(T.admins).select('user_id').eq('user_id', user.id).maybeSingle();
        if (error) throw error;
        return !!data;
      },

      /* ----- Files ----- */
      async uploadAsset(file) {
        const isImage = /^image\//.test(file.type);
        const isPdf = file.type === 'application/pdf';
        if (!isImage && !isPdf) throw new Error('Upload a JPG, PNG, WebP, GIF or PDF file.');
        if (file.type === 'image/svg+xml') throw new Error('SVG uploads are not allowed. Use PNG, JPG or WebP.');
        if (file.size > 15 * 1024 * 1024) throw new Error('The file is larger than 15 MB.');
        const body = isImage ? await optimizeImage(file, 1600, 0.82) : file;
        const ext = isPdf ? 'pdf' : body.type === 'image/webp' ? 'webp' : (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
        const d = new Date();
        const path = 'uploads/' + d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + '.' + ext;
        const bucket = cfg.storageBucket;
        const up = await need().storage.from(bucket).upload(path, body, { contentType: body.type || file.type, upsert: false, cacheControl: '31536000' });
        if (up.error) {
          if (/bucket not found/i.test(up.error.message || '')) throw new Error('Storage bucket "' + bucket + '" does not exist. Run supabase/schema.sql.');
          throw up.error;
        }
        return need().storage.from(bucket).getPublicUrl(path).data.publicUrl;
      },

      /* ----- Contact messages ----- */
      async submitMessage(m) {
        unwrap(await need().from(T.messages).insert({ name: m.name, email: m.email, subject: m.subject || '', message: m.message }));
      },
      async listMessages() { return unwrap(await need().from(T.messages).select('*').order('created_at', { ascending: false }).limit(300)) || []; },
      async setMessageRead(id, read) { unwrap(await need().from(T.messages).update({ is_read: read }).eq('id', id)); },
      async deleteMessage(id) { unwrap(await need().from(T.messages).delete().eq('id', id)); },
      async countUnread() {
        const r = await need().from(T.messages).select('id', { count: 'exact', head: true }).eq('is_read', false);
        if (r.error) throw r.error;
        return r.count || 0;
      },

      /* ----- Legacy tables (read-only, used by the one-click import) ----- */
      async loadLegacy() {
        const names = ['profile', 'contact', 'skills', 'experiences', 'education', 'certificates', 'projects', 'services'];
        const out = {};
        await Promise.all(names.map(async (n) => {
          const r = await need().from(n).select('*');
          out[n] = r.error ? null : r.data || [];
        }));
        return out;
      },

      /* ----- Health checks (admin dashboard) ----- */
      async health() {
        const checks = [];
        const add = (name, ok, message) => checks.push({ name, ok, message: message || '' });
        if (!configured) { add('Supabase configuration', false, 'Set supabaseUrl and supabaseAnonKey in assets/js/config.js.'); return checks; }
        if (!client) { add('Supabase client', false, 'The Supabase script did not load. Check your connection.'); return checks; }
        add('Supabase configuration', true);
        for (const [label, table] of [['Published content table', T.published], ['Draft content table', T.draft], ['Contact messages table', T.messages], ['Admins table', T.admins]]) {
          const r = await client.from(table).select('*', { count: 'exact', head: true });
          add(label + ' (' + table + ')', !r.error, r.error ? PF.errMsg(r.error) : '');
        }
        try { await store.isAdmin().then((ok) => add('This account is an admin', ok, ok ? '' : 'Add this user to the admins table (see README).')); } catch (e) { add('This account is an admin', false, PF.errMsg(e)); }
        const s = await client.storage.from(cfg.storageBucket).list('', { limit: 1 });
        add('Storage bucket (' + cfg.storageBucket + ')', !s.error, s.error ? 'Bucket missing or not readable. Run supabase/schema.sql.' : '');
        return checks;
      }
    };
    return store;
  };
})();

  }
  function footer(d, sections, offline) {

      '<nav class="footer-links" aria-label="Footer">' + links + '</nav>' + socialLinks(d) +

      '<button class="to-top" id="toTop" type="button" aria-label="' + esc(d.site.ui.backToTop) + '">' + PF.icon('up') + '</button>';

  /* Renders the full page. Contact is guaranteed to be the last <section>. */
  PF.renderSite = function (root, data, opts) {
    opts = opts || {};
    const sections = PF.visibleSections(data);

    const body = sections.map((s) => {
      const tone = s.id === 'hero' ? '' : (alt++ % 2 ? 'alt' : 'base');
      return R[s.id](data, tone) + (s.id === 'hero' ? marquee(data) : '');
    }).join('');
    root.innerHTML = nav(data, sections) + '<main id="main" tabindex="-1">' + body + '</main>' + footer(data, sections, opts.offline);
    document.title = data.site.title || data.site.brandName;
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', data.site.description || '');
  };
})();

/* assets/js/site/main.js */
/* Public site bootstrap: loads content, renders it, wires up behaviour. */
(function () {
  'use strict';
  const PF = window.PF;
  const root = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const mode = params.get('preview'); /* 'live' (admin iframe) | 'draft' | null */
  const store = PF.createStore();
  let current = null;
  let renderedAt = Date.now();

  /* ---------- Rendering ---------- */
  function paint(raw, offline) {
    current = PF.normalize(raw);
    PF.renderSite(root, current, { offline: !!offline });
    renderedAt = Date.now();
    setupFilters();
    observeSections();
    setupReveal();
    onScroll();
  }

  /* ---------- Navigation behaviour (delegated, bound once) ---------- */
  function closeMenu() {
    const nav = document.getElementById('siteNav');
    const t = document.getElementById('navToggle');
    if (!nav || !t) return;
    nav.classList.remove('nav-open');
    t.setAttribute('aria-expanded', 'false');
    t.setAttribute('aria-label', t.dataset.open);
  }
  document.addEventListener('click', (e) => {
    const toggle = e.target.closest('#navToggle');
    if (toggle) {
      const nav = document.getElementById('siteNav');
      const open = nav.classList.toggle('nav-open');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? toggle.dataset.close : toggle.dataset.open);
      return;
    }
    if (e.target.closest('#navLinks a, .nav-actions a')) closeMenu();
    if (e.target.closest('#toTop')) window.scrollTo({ top: 0, behavior: 'smooth' });
    const pill = e.target.closest('.pill[data-filter]');
    if (pill) applyFilter(pill);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeMenu(); } });

  function onScroll() {
    const t = document.getElementById('toTop');
    if (t) t.classList.toggle('show', window.scrollY > 700);
    sweep();
    const bar = document.getElementById('scrollProgress');
    if (bar) { const max = document.documentElement.scrollHeight - window.innerHeight; bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')'; }
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  /* Highlights the nav link of the section currently in view. */
  let spy = null;
  function observeSections() {
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        document.querySelectorAll('#navLinks a').forEach((a) => {
          if (a.dataset.nav === en.target.id) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
        });
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('main > section').forEach((s) => spy.observe(s));
  }

  /* ---------- Scroll reveal (skipped for reduced motion; content stays visible without JS) ---------- */
  const REVEAL = '.section-head, .contact-copy h2, .contact-copy > *, .prose, .journey li, .tl-item, .skill-row, .svc-cat h3, .svc-card, .filters, .proj-card, .cert-card, .form-card, .social-card, .empty:not([data-empty])';
  let revealObs = null;
  function reveal(el) {
    if (revealObs) revealObs.unobserve(el);
    el.classList.add('in');
    setTimeout(() => el.classList.remove('reveal', 'in'), 1300); /* hand hover transitions back to normal */
  }
  /* Catches elements that were scrolled past too fast for the observer to notice. */
  let sweeping = false;
  function sweep() {
    if (sweeping) return; sweeping = true;
    requestAnimationFrame(() => {
      sweeping = false;
      document.querySelectorAll('.reveal:not(.in)').forEach((el) => { if (el.getBoundingClientRect().top < window.innerHeight * 0.94) reveal(el); });
    });
  }
  function setupReveal() {
    if (revealObs) revealObs.disconnect();
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    revealObs = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) reveal(en.target); });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('main > section:not(.hero)').forEach((sec) => {
      const seen = new Map();
      sec.querySelectorAll(REVEAL).forEach((el) => {
        const key = el.parentElement;
        const i = seen.get(key) || 0; seen.set(key, i + 1);
        el.style.setProperty('--i', Math.min(i, 7));
        el.classList.add('reveal');
        revealObs.observe(el);
      });
    });
  }

  /* Soft highlight that follows the pointer over cards. */
  document.addEventListener('pointermove', (e) => {
    const card = e.target.closest && e.target.closest('.svc-card, .proj-card, .cert-card, .form-card, .social-card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  /* ---------- Project filters (platform + category) ---------- */
  const filterState = { platform: '', category: '' };
  function setupFilters() { filterState.platform = ''; filterState.category = ''; updateProjects(); }
  function applyFilter(pill) {
    filterState[pill.dataset.filter] = pill.dataset.value;
    pill.closest('.filter-group').querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', String(p === pill)));
    updateProjects();
  }
  function updateProjects() {
    const cards = [...document.querySelectorAll('.proj-card')];
    if (!cards.length) return;
    let shown = 0;
    cards.forEach((c) => {
      const ok = (!filterState.platform || c.dataset.platform === filterState.platform) && (!filterState.category || c.dataset.category === filterState.category);
      c.hidden = !ok;
      if (ok) c.classList.remove('reveal', 'in');
      if (ok) shown++;
    });
    const count = document.querySelector('.filter-count');
    if (count) count.textContent = count.dataset.template.replace('{shown}', shown).replace('{total}', count.dataset.total);
    const empty = document.querySelector('[data-empty]');
    if (empty) empty.hidden = shown > 0;
  }

  /* Broken images fall back to the placeholder instead of showing a broken icon. */
  document.addEventListener('error', (e) => {
    const el = e.target;
    if (!el || el.tagName !== 'IMG') return;
    if (el.closest('.proj-media, .cert-media')) el.remove();
    else if (el.classList.contains('tl-logo') || el.classList.contains('about-photo') || el.classList.contains('portrait')) el.remove();
  }, true);

  /* ---------- Contact form ---------- */
  const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  const COOLDOWN_KEY = 'pf-last-message';
  function fieldError(form, name, msg) {
    const wrap = form.querySelector('[data-field="' + name + '"]');
    if (!wrap) return;
    wrap.dataset.invalid = msg ? 'true' : 'false';
    wrap.querySelector('.field-error').textContent = msg || '';
    const input = wrap.querySelector('input,textarea');
    if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
  }
  function status(form, state, text) {
    const s = form.querySelector('.form-status');
    s.hidden = !text; s.dataset.state = state; s.textContent = text || '';
  }
  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('#contactForm');
    if (!form) return;
    e.preventDefault();
    const v = (n) => (form.elements[n] ? form.elements[n].value.trim() : '');
    const vals = { name: v('name'), email: v('email'), subject: v('subject'), message: v('message') };
    const errors = {};
    if (!vals.name) errors.name = 'Enter your name.';
    if (!vals.email) errors.email = 'Enter your email address.'; else if (!EMAIL.test(vals.email)) errors.email = 'Enter a valid email address, like name@example.com.';
    if (vals.subject.length > 200) errors.subject = 'Keep the subject under 200 characters.';
    if (!vals.message) errors.message = 'Write a message.'; else if (vals.message.length < 10) errors.message = 'The message is too short. Write at least 10 characters.';
    ['name', 'email', 'subject', 'message'].forEach((n) => fieldError(form, n, errors[n]));
    if (Object.keys(errors).length) {
      status(form, 'error', form.dataset.invalid);
      const first = form.querySelector('[aria-invalid="true"]'); if (first) first.focus();
      return;
    }
    /* Spam protection: honeypot, minimum fill time, cooldown. Bots get a silent success. */
    if (form.elements.company_site.value) { status(form, 'ok', form.dataset.ok); form.reset(); return; }
    if (Date.now() - renderedAt < 3000) { status(form, 'error', 'Please take a moment to review your message, then send it again.'); return; }
    const last = Number(localStorage.getItem(COOLDOWN_KEY) || 0);
    if (Date.now() - last < 60000) { status(form, 'error', 'You just sent a message. Please wait a minute before sending another.'); return; }
    if (!store.available || mode) { status(form, 'error', mode ? 'The form is disabled in preview mode.' : form.dataset.off); return; }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = form.dataset.sending;
    try {
      await store.submitMessage(vals);
      try { localStorage.setItem(COOLDOWN_KEY, String(Date.now())); } catch (err) { /* ignore */ }
      form.reset();
      status(form, 'ok', form.dataset.ok);
    } catch (err) {
      console.warn('Contact form error:', PF.errMsg(err));
      status(form, 'error', form.dataset.fail);
    } finally {
      btn.disabled = false; btn.textContent = form.dataset.submit;
    }
  });
  document.addEventListener('input', (e) => {
    const f = e.target.closest('#contactForm .field');
    if (f && f.dataset.invalid === 'true') fieldError(f.closest('form'), e.target.name, '');
  });

  /* ---------- Preview banner ---------- */
  function banner(text) {
    let b = document.getElementById('previewBanner');
    if (!b) { b = document.createElement('div'); b.id = 'previewBanner'; b.className = 'preview-banner'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
    b.textContent = text;
  }

  /* ---------- Boot ---------- */
  async function boot() {
    if (mode === 'live') {
      /* Admin dashboard streams its unsaved draft into this page via postMessage. */
      paint(PF.defaults());
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || e.source !== window.parent) return;
        if (e.data && e.data.type === 'pf-draft' && e.data.data) { const y = window.scrollY; paint(e.data.data); window.scrollTo(0, y); }
      });
      window.parent.postMessage({ type: 'pf-ready' }, location.origin);
      return;
    }
    if (mode === 'draft') {
      banner('Draft preview. Not published yet.');
      try {
        const row = await store.loadDraft();
        if (!row) throw new Error('No draft saved yet.');
        paint(row.data);
      } catch (err) {
        paint(PF.defaults());
        banner('Draft preview needs an admin session. Sign in at admin.html, then reload.');
      }
      return;
    }
    const cached = store.readCache();
    if (cached) paint(cached);
    try {
      const row = await store.loadPublished();
      const next = row ? row.data : null;
      if (next) store.writeCache(next);
      const incoming = PF.normalize(next || PF.defaults());
      if (!current || !PF.same(current, incoming)) paint(incoming);
    } catch (err) {
      console.warn('Could not load published content:', PF.errMsg(err));
      if (!current) paint(PF.defaults(), store.configured);
    }
  }
  boot();
})();

});
</script>
</body>
</html>
